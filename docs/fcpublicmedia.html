<html>
<head>
  <meta charset="utf-8" />
  <title>FC Public Media</title>
  <link rel="stylesheet" href="css/site.css?v=20260823">
  <link rel="stylesheet" href="css/sub-pages.css?v=20260823">
  <link rel="stylesheet" href="css/showcase.css?v=20260901">
  <link rel="stylesheet" href="assets/ds/colors.css?v=20260823">
  <link rel="stylesheet" href="assets/ds/typography.css?v=20260823">
  <link rel="stylesheet" href="assets/ds/spacing.css?v=20260823">
  <link rel="stylesheet" href="assets/ds/fonts.css?v=20260823">
  <link rel="stylesheet" href="css/projects.css?v=20260823">
  <meta name="viewport" content="width=device-width, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="icon" type="image/png" href="img/favicon.128.png" sizes="128x128">
  <link rel="apple-touch-icon" href="img/favicon.128.png" sizes="128x128">
  <script src="js/copyright.js?v=20260823"></script>
</head>
<body class="showcase project fcpm">
  <div id="bg">
    <div id="dark"></div>

    <div id="title-stack" role="banner" aria-label="Project title">
      <div id="home-link">
        <a href="./" class="brand-font" aria-label="Home link and logo">discovery Written</a>
      </div>
      <h1 id="title-stroke" inert>FC Public Media</h1>
      <h1 id="title" aria-describe="Title:">FC Public Media</h1>
    </div>

    <div class="pair">
      <h2 class="brand-font h-text-version">A project</h2>
      <h2 class="brand-font h-audio-version"></h2>
    </div>

    <!-- The exhibits' anchor bar. The left half is deliberately empty for
         whatever wants to live there later; the right holds the way out. -->
    <div class="pair links media">
      <nav id="chapters-control" aria-label="Sections">
        <div class="tabs" role="list" aria-label="Sections"></div>
      </nav>
      <div id="music-control" class="group-label" role="list" aria-label="Elsewhere">
        <a role="list-item" href="https://new.fcpublicmedia.org" rel="noopener" title="Visit FC Public Media">
          <img alt="FC Public Media mark" src="img/mini-fcpm.webp" width="45" />
          <span>Visit</span>
        </a>
      </div>
    </div>

    <div id="scroll-top"></div>

    <div id="showcase">
      <div id="content" class="content">
        <div class="feature">
          <img src="img/mini-fcpm.webp" width="88" height="88" alt="FC Public Media mark" />
        </div>
        <p class="tagline">Don&#8217;t Just View It.</p>

        <!-- Words go here. The paragraph is intentionally empty until then; it
             renders a faint placeholder from css, so nothing has to be deleted
             to fill it in. -->
        <p class="note"></p>

        <p class="visit">
          <a href="https://new.fcpublicmedia.org" rel="noopener">Visit</a>
          <span class="host">new.fcpublicmedia.org</span>
        </p>

        <div id="footer" role="contentinfo" aria-label="Copyright">
          <div><img src="img/favicon.128.png" width="48" alt="Discovery Written" /></div>
          <div>&copy; <span class="copyright-year">2026</span> Discovery Written, LLC</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
